name: Sovereign Cloud Ignition Pipeline (CI/CD)

on:
  push:
    branches:
      - production
      - master
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/bashasnoglu-jpg/santis-sovereign-os

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive Tags
        id: meta
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          BRANCH=${GITHUB_REF##*/}

          TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:${SHORT_SHA}"

          if [ "$BRANCH" = "main" ]; then
            TAGS="$TAGS,${IMAGE_NAME}:production"
          elif [ "$BRANCH" = "develop" ]; then
            TAGS="$TAGS,${IMAGE_NAME}:staging"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sovereign
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rollback:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rollback to stable
        run: |
          docker pull ${IMAGE_NAME}:production
          docker tag ${IMAGE_NAME}:production ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:latest
