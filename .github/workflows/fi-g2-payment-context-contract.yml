name: FI-G2 Payment Context Contract

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "app/payment_context_contract.py"
      - "app/api/v1/endpoints/payment_context.py"
      - "app/main.py"
      - "api/index.py"
      - "tests/test_payment_context_contract.py"
      - "tests/test_vercel_runtime_entrypoint.py"
      - ".github/workflows/fi-g2-payment-context-contract.yml"

permissions:
  contents: read

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Run FI-G2 contract and Vercel entrypoint tests
        run: |
          python -m pytest -q \
            tests/test_payment_context_contract.py \
            tests/test_vercel_runtime_entrypoint.py
