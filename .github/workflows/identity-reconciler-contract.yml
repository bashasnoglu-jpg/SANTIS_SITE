name: Identity Reconciler Contract

on:
  pull_request:
    paths:
      - 'scripts/ops/identity-evidence-reconciler*.mjs'
      - 'app/domain/identity_write_through.py'
      - 'app/api/v1/endpoints/identity_boundary.py'
      - 'app/main.py'
      - 'api/index.py'
      - 'tests/test_identity_write_through.py'
      - 'requirements.txt'
      - '.github/workflows/identity-reconciler-contract.yml'
  push:
    branches:
      - 'p0/identity-event-reconciler'
      - 'p0/identity-sync-boundary'
    paths:
      - 'scripts/ops/identity-evidence-reconciler*.mjs'
      - 'app/domain/identity_write_through.py'
      - 'app/api/v1/endpoints/identity_boundary.py'
      - 'app/main.py'
      - 'api/index.py'
      - 'tests/test_identity_write_through.py'
      - 'requirements.txt'
      - '.github/workflows/identity-reconciler-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    name: P0 identity reconciliation contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check reconciler core
        run: node --check scripts/ops/identity-evidence-reconciler-core.mjs

      - name: Syntax check reconciler runtime
        run: node --check scripts/ops/identity-evidence-reconciler.mjs

      - name: Run deterministic reconciler tests
        run: node --test scripts/ops/identity-evidence-reconciler.test.mjs

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile synchronous boundary
        run: |
          python -m compileall -q \
            app/domain/identity_write_through.py \
            app/api/v1/endpoints/identity_boundary.py \
            app/main.py \
            api/index.py

      - name: Run synchronous boundary core tests
        run: python -m unittest discover -s tests -p 'test_identity_write_through.py' -v

      - name: Import production FastAPI runtime
        run: python -c "from api.index import app; print(app.title)"
