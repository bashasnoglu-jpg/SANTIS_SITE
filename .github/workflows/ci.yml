name: Santis OS CI Lockdown

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-audit:
    name: Primal Security & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.24.0

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies (Frozen Lockfile Enforced)
        run: pnpm install --frozen-lockfile

      - name: Root Typecheck
        run: pnpm typecheck

      - name: Phase 4H Resource Conflict Tests
        run: pnpm exec tsx --test packages/domain-schema/src/scheduling.resource-conflict.phase4h.test.ts packages/database/src/repositories/scheduling.resource-lock.phase4h.test.ts

      - name: Root Lint
        run: pnpm lint

      - name: Root MPA Build
        run: pnpm build:mpa

      - name: Admin Panel Typecheck
        run: pnpm --filter admin-panel typecheck

      - name: Admin Panel Lint
        run: pnpm --filter admin-panel lint

      - name: Admin Panel Build
        run: pnpm --filter admin-panel build

      - name: Stitch Enforce
        run: pnpm stitch:enforce

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Test Dependencies
        run: python -m pip install -r requirements.txt pytest httpx

      - name: Reception Write Security Tests
        run: python -m pytest tests/test_reception_security.py -q
