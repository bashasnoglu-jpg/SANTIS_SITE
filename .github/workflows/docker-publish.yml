name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bashasnoglu-jpg/santis-sovereign-os
  TELEMETRY_ENDPOINT: http://localhost:3030/api/v1/telemetry/beacon

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Enforce lowercase image contract
        run: |
          if [[ "$IMAGE_NAME" =~ [A-Z] ]]; then
            echo "Image name must be lowercase: $IMAGE_NAME"
            exit 1
          fi

      - name: Emit DEPLOYMENT_STARTED
        run: |
          curl -X POST $TELEMETRY_ENDPOINT \
          -H "Content-Type: application/json" \
          -d '{
            "event":"DEPLOYMENT_STARTED",
            "status":"started",
            "repository":"${{ github.repository }}",
            "workflow":"docker-publish",
            "runId":"${{ github.run_id }}",
            "runUrl":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "sha":"${{ github.sha }}",
            "image":"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest",
            "timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          }'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Emit IMAGE_PUBLISHED
        if: success()
        run: |
          curl -X POST $TELEMETRY_ENDPOINT \
          -H "Content-Type: application/json" \
          -d '{
            "event":"IMAGE_PUBLISHED",
            "status":"published",
            "repository":"${{ github.repository }}",
            "workflow":"docker-publish",
            "runId":"${{ github.run_id }}",
            "runUrl":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "sha":"${{ github.sha }}",
            "image":"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest",
            "timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          }'

      - name: Emit DEPLOYMENT_FAILED
        if: failure()
        run: |
          curl -X POST $TELEMETRY_ENDPOINT \
          -H "Content-Type: application/json" \
          -d '{
            "event":"DEPLOYMENT_FAILED",
            "status":"failed",
            "repository":"${{ github.repository }}",
            "workflow":"docker-publish",
            "runId":"${{ github.run_id }}",
            "runUrl":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "sha":"${{ github.sha }}",
            "image":"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest",
            "timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          }'
