name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase name for production stability
  IMAGE_NAME: bashasnoglu-jpg/santis-sovereign-os
  # [SEC-03] localhost:3030 kaldırıldı.
  # GitHub Actions → Settings → Variables → TELEMETRY_ENDPOINT olarak set et.
  # Set edilmemişse telemetry adımları continue-on-error ile sessizce atlanır.
  TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT || '' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize repository and image names
        run: |
          # Ensure IMAGE_NAME is lowercase
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          # Create a strictly lowercase repo name for tagging if needed
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Enforce lowercase image contract
        run: |
          if [[ "${{ env.IMAGE_NAME }}" =~ [A-Z] ]]; then
            echo "CRITICAL: Image name contains uppercase characters: ${{ env.IMAGE_NAME }}"
            exit 1
          fi

      - name: Emit DEPLOYMENT_STARTED
        continue-on-error: true
        run: |
          curl -X POST $TELEMETRY_ENDPOINT \
          -H "Content-Type: application/json" \
          --fail-with-body --show-error \
          -d '{
            "event":"DEPLOYMENT_STARTED",
            "status":"started",
            "repository":"${{ env.REPO_LC }}",
            "workflow":"docker-publish",
            "runId":"${{ github.run_id }}",
            "runUrl":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "sha":"${{ github.sha }}",
            "image":"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest",
            "timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          }'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Emit IMAGE_PUBLISHED
        if: success()
        continue-on-error: true
        run: |
          curl -X POST $TELEMETRY_ENDPOINT \
          -H "Content-Type: application/json" \
          --fail-with-body --show-error \
          -d '{
            "event":"IMAGE_PUBLISHED",
            "status":"published",
            "repository":"${{ env.REPO_LC }}",
            "workflow":"docker-publish",
            "runId":"${{ github.run_id }}",
            "runUrl":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "sha":"${{ github.sha }}",
            "image":"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest",
            "timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          }'

      - name: Emit DEPLOYMENT_FAILED
        if: failure()
        continue-on-error: true
        run: |
          curl -X POST $TELEMETRY_ENDPOINT \
          -H "Content-Type: application/json" \
          --fail-with-body --show-error \
          -d '{
            "event":"DEPLOYMENT_FAILED",
            "status":"failed",
            "repository":"${{ env.REPO_LC }}",
            "workflow":"docker-publish",
            "runId":"${{ github.run_id }}",
            "runUrl":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "sha":"${{ github.sha }}",
            "image":"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest",
            "timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          }'
