# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow installs Deno, then lints/tests only explicit Deno sources.
# For more information see: https://github.com/denoland/setup-deno

name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        # uses: denoland/setup-deno@v1
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31  # v1.1.2
        with:
          deno-version: v1.x

      # Uncomment this step to verify the use of 'deno fmt' on each commit.
      # - name: Verify formatting
      #   run: deno fmt --check

      - name: Detect Deno sources
        id: deno_sources
        shell: bash
        run: |
          mapfile -t sources < <(git ls-files \
            '**/*.deno.ts' \
            '**/*.deno.tsx' \
            '**/*.deno.js' \
            '**/*.deno.jsx')

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "has_sources=false" >> "$GITHUB_OUTPUT"
            echo "No Deno-specific sources found; skipping Deno lint/test."
          else
            printf '%s\n' "${sources[@]}" > deno-sources.txt
            echo "has_sources=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run linter
        if: steps.deno_sources.outputs.has_sources == 'true'
        run: xargs deno lint < deno-sources.txt

      - name: Run tests
        if: steps.deno_sources.outputs.has_sources == 'true'
        run: xargs deno test -A < deno-sources.txt
