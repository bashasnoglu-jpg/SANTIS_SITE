name: AI Pre-Review Prepare

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-pre-review-prepare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare sanitized non-binding review input
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Create bounded and sanitized review input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_OUTPUT: ai-pre-review-input/review-input.json
        run: |
          mkdir -p ai-pre-review-input
          node services/ai-review-evidence/scripts/prepare-diff.mjs

      - name: Upload review input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-pre-review-input-${{ github.event.pull_request.number }}
          path: ai-pre-review-input/review-input.json
          if-no-files-found: error
          retention-days: 3
