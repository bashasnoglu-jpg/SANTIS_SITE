name: Autonomous Edge Reliability Orchestrator (Predictive Engine)

# Disabled as an automatic deployment path.
# Vercel GitHub App is the source of truth for deployments.
# This workflow is kept for manual diagnostics only to avoid duplicate deploys,
# missing VERCEL_TOKEN failures, and unnecessary Vercel deployment quota usage.
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  deploy-path-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment path intentionally disabled
        run: |
          echo "GitHub Actions Vercel deployment is disabled."
          echo "Use the Vercel GitHub App deployment pipeline instead."
