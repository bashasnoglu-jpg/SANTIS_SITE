name: AI Pre-Review Evaluate

on:
  workflow_run:
    workflows: ["AI Pre-Review Prepare"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Validate artifact provenance
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.preflight.outputs.eligible }}

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ai-pre-review-input
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --dir ai-pre-review-input
          find ai-pre-review-input -name review-manifest.json -type f -print -quit \
            | grep -q review-manifest.json

      - name: Validate repository, provenance, and complete multipart boundary
        id: preflight
        env:
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_OWNER_ID: ${{ github.event.repository.owner.id }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          MANIFEST_PATH="$(find ai-pre-review-input -name review-manifest.json -type f -print -quit)"
          test -n "${MANIFEST_PATH}"
          node services/ai-review-evidence/scripts/workflow-preflight.mjs "${MANIFEST_PATH}"

  not-deployed:
    name: Shadow endpoint not deployed
    needs: preflight
    if: ${{ needs.preflight.outputs.eligible == 'true' && vars.GCP_EVIDENCE_API_URL == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record non-deployment state
        run: |
          {
            echo "## AI pre-review evaluation"
            echo
            echo "Skipped: GCP_EVIDENCE_API_URL is unset and activation is not authorized."
            echo "No model call or governance mutation occurred."
          } >> "$GITHUB_STEP_SUMMARY"

  caller-not-configured:
    name: Dedicated evidence caller or KMS verification not configured
    needs: preflight
    if: >-
      ${{ needs.preflight.outputs.eligible == 'true' &&
          vars.GCP_EVIDENCE_API_URL != '' &&
          (vars.GCP_EVIDENCE_CALLER_SERVICE_ACCOUNT == '' ||
           vars.GCP_EVIDENCE_KMS_KEY_VERSION == '' ||
           vars.GCP_EVIDENCE_KMS_PUBLIC_KEY_PEM == '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Record least-privilege configuration block
        run: |
          {
            echo "## AI pre-review evaluation"
            echo
            echo "Blocked: dedicated caller or trusted KMS verification material is unset."
            echo "The deployment identity and unverified signatures are never accepted as fallbacks."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  evaluate:
    name: Generate and verify signed non-binding multipart evidence
    needs: preflight
    if: >-
      ${{ needs.preflight.outputs.eligible == 'true' &&
          vars.GCP_EVIDENCE_API_URL != '' &&
          vars.GCP_EVIDENCE_CALLER_SERVICE_ACCOUNT != '' &&
          vars.GCP_EVIDENCE_KMS_KEY_VERSION != '' &&
          vars.GCP_EVIDENCE_KMS_PUBLIC_KEY_PEM != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ai-pre-review-input
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --dir ai-pre-review-input

      - name: Revalidate complete package before Google authentication
        env:
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_OWNER_ID: ${{ github.event.repository.owner.id }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          FAIL_ON_INELIGIBLE: "true"
        run: |
          set -euo pipefail
          MANIFEST_PATH="$(find ai-pre-review-input -name review-manifest.json -type f -print -quit)"
          test -n "${MANIFEST_PATH}"
          node services/ai-review-evidence/scripts/workflow-preflight.mjs "${MANIFEST_PATH}"

      - name: Authenticate through Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVIDENCE_CALLER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_EVIDENCE_API_URL }}
          create_credentials_file: false

      - name: Request and validate signed shadow evidence for every part
        env:
          EVIDENCE_API_URL: ${{ vars.GCP_EVIDENCE_API_URL }}
          EVIDENCE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          EVIDENCE_KMS_KEY_VERSION: ${{ vars.GCP_EVIDENCE_KMS_KEY_VERSION }}
          EVIDENCE_KMS_PUBLIC_KEY_PEM: ${{ vars.GCP_EVIDENCE_KMS_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          MANIFEST_PATH="$(find ai-pre-review-input -name review-manifest.json -type f -print -quit)"
          PACKAGE_DIR="$(dirname "${MANIFEST_PATH}")"
          mkdir -p signed-evidence

          mapfile -t PART_PATHS < <(node - "${MANIFEST_PATH}" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const part of manifest.parts) console.log(part.path);
          NODE
          )

          test "${#PART_PATHS[@]}" -gt 0
          part_count="${#PART_PATHS[@]}"
          part_index=0
          for relative_part in "${PART_PATHS[@]}"; do
            part_index=$((part_index + 1))
            INPUT_PATH="${PACKAGE_DIR}/${relative_part}"
            part_name="$(basename "${relative_part}" .json)"
            EVIDENCE_PATH="signed-evidence/${part_name}-evidence.json"

            echo "part ${part_index}/${part_count} request started"
            if ! HTTP_STATUS="$(curl --silent --show-error \
              --output "${EVIDENCE_PATH}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${EVIDENCE_ID_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary "@${INPUT_PATH}" \
              "${EVIDENCE_API_URL}/v1/reviews/evaluate")"; then
              echo "shadow HTTP status = transport-error"
              echo "HTTP gate = FAIL"
              exit 1
            fi

            case "${HTTP_STATUS}" in
              200)
                echo "shadow HTTP status = 200"
                echo "HTTP gate = PASS"
                ;;
              401)
                echo "shadow HTTP status = 401"
                echo "HTTP gate = FAIL"
                exit 1
                ;;
              403)
                echo "shadow HTTP status = 403"
                echo "HTTP gate = FAIL"
                exit 1
                ;;
              4??)
                echo "shadow HTTP status = 4xx"
                echo "HTTP gate = FAIL"
                exit 1
                ;;
              5??)
                echo "shadow HTTP status = 5xx"
                echo "HTTP gate = FAIL"
                exit 1
                ;;
              *)
                echo "shadow HTTP status = other"
                echo "HTTP gate = FAIL"
                exit 1
                ;;
            esac

            echo "response validator = STARTED"
            if node services/ai-review-evidence/scripts/validate-evidence-response.mjs \
              "${INPUT_PATH}" \
              "${EVIDENCE_PATH}" >/dev/null 2>&1; then
              echo "response validator = PASS"
            else
              echo "response validator = FAIL"
              exit 1
            fi
          done

          test "$(find signed-evidence -name '*-evidence.json' -type f | wc -l)" -eq "${#PART_PATHS[@]}"

      - name: Upload complete signed evidence package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-pre-review-evidence-${{ github.event.workflow_run.id }}
          path: signed-evidence/
          if-no-files-found: error
          retention-days: 30
