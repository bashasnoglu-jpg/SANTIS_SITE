        body.santis-archive-body {

        /* 1. Dynamic Atmosphere Aura layer */

            z-index: -1;

            animation: breath-cycle var(--santis-breathing-speed) ease-in-out infinite alternate;

        @keyframes breath-cycle {

        /* 3. Main Layout Grid */
        #nv-main {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 50px;

        @media (max-width: 1024px) {

        /* 4. Timeline Area */
        .timeline-section {
            display: flex;
            flex-direction: column;

        .section-header {

            padding-left: 15px;
            font-weight: 300;
            text-transform: uppercase;
        }

        .timeline-container {
            position: relative;
            padding-left: 10px;
        }

        /* 5. Day Node styling */
        .day-node {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(12px);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .day-node::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 3px; height: 100%;
            background: transparent;
            transition: background 0.3s ease;
        }

        .day-node:hover {
            border-color: rgba(212, 175, 55, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(212, 175, 55, 0.05);
            transform: translateY(-4px);
        }

        .day-node.is-active {
            border-color: var(--gold);
            background: rgba(25, 23, 20, 0.85);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 35px var(--gold-glow);
        }

        .day-node.is-active::before {
            background: var(--gold);
        }

        .day-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .day-label {
            font-size: 1.1rem;
            font-weight: 300;
            color: #fff;
            letter-spacing: 2px;
        }

        .day-subinfo {
            font-size: 0.75rem;
            color: var(--gray-subtle);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .day-state-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: fit-content;
            margin-top: 4px;

        .tag-regulated { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .tag-restored { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border: 1px solid rgba(0, 229, 255, 0.2); }
        .tag-strained { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .tag-elevated { background: rgba(212, 175, 55, 0.1); color: #d4af37; border: 1px solid rgba(212, 175, 55, 0.2); }

        /* 6. Biometric Concentric Rings SVG inside node */
        .ring-visualizer {
            position: relative;
            transition: transform 0.4s ease;
        }

        .day-node:hover .ring-visualizer {
            transform: scale(1.05);
        }

        .metric-ring {
            transition: stroke-dashoffset 1s ease-in-out, filter 0.6s ease;
        }

        .day-node.is-active .metric-ring {
            filter: drop-shadow(0 0 var(--santis-active-glow) var(--santis-active-glow-color));
        }

        /* 7. Days Connection Bridge styling with flow motion */
        .context-bridge-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 6px 0;
            position: relative;
        }

        .context-bridge {
            width: 2px;
            height: 60px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.05), rgba(212, 175, 55, 0.2), rgba(255, 255, 255, 0.05));
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .context-bridge::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent, var(--gold), transparent);
            opacity: 0.6;
            transition: opacity 0.4s ease;
        }

        /* Flowing keyframe active on bridges */
        .context-bridge.is-flowing::before {
            animation: bridge-flow-animation var(--santis-bridge-flow-speed) linear infinite;
            animation-direction: var(--santis-bridge-flow-direction);
        }

        @keyframes bridge-flow-animation {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .context-bridge::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            background: var(--bg-dark);
            border: 2px solid var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            transition: all 0.4s ease;
            z-index: 5;
        }

        .context-bridge:hover::after, .context-bridge.is-active::after {
            transform: translate(-50%, -50%) scale(1.6);
            background: var(--gold);
            box-shadow: 0 0 20px var(--gold);
        }

        .context-bridge:hover, .context-bridge.is-active {

            background: linear-gradient(to bottom, rgba(212, 175, 55, 0.2), var(--gold), rgba(212, 175, 55, 0.2));
            box-shadow: 0 0 15px var(--gold-glow);

        /* Biometric Stat Bars */
        .stat-bars-container {

        .stat-bar-item {

        }

        .stat-bar-label {
            font-size: 0.75rem;
            color: #ccc;

            text-transform: uppercase;
            display: flex;
            justify-content: space-between;

        .stat-bar-track {
            height: 3px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 2px;
            overflow: hidden;
            position: relative;

        .stat-bar-fill {
            height: 100%;

            transition: width 1s cubic-bezier(0.25, 1, 0.5, 1);

        /* Editorial Diarist Whisper Area */
        .whisper-box {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.03) 0%, transparent 100%);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 16px;
            padding: 24px;
            position: relative;
        }

        .whisper-box::before {
            content: '“';
            position: absolute;
            top: 10px; left: 15px;
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: rgba(212, 175, 55, 0.1);
            line-height: 1;
        }

        .whisper-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-style: italic;
            color: #e5e5e5;
            line-height: 1.6;
            margin: 0 0 12px 0;
            position: relative;
            z-index: 2;
        }

        .whisper-tone {
            font-size: 0.7rem;
            color: var(--gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Info Grid styling */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px;
        }

        .info-card-label {
            font-size: 0.65rem;
            color: var(--gray-subtle);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .info-card-val {
            font-size: 0.85rem;
            color: #fff;
            letter-spacing: 0.5px;
        }

        /* Tags list */
        .flex-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .small-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 9. Animations & Utilities */
        .santis-refracted {
            animation: santis-fade-in-blur 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes santis-fade-in-blur {
            0% { opacity: 0; filter: blur(12px); transform: translateY(15px) scale(0.98); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
        }

        /* Transition utility */
        .transition-all-mid {
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
    </style>
</head>

    <!-- Core Engine Scripts -->
    <script>
        /**
         * ==========================================================================
         * 📊 SANTIS OBSERVABILITY: LOCAL FALLBACK COUNTER (Phase 29.4)
         * ==========================================================================
         */
        (function initSantisFallbackObservability() {
            if (window.__SANTIS_OBSERVABILITY__) return;

            window.__SANTIS_OBSERVABILITY__ = {
                fallback: {
                    total: 0,
                    byReason: {},
                    byModule: {},
                    events: []
                },

                recordFallback({ module = "unknown", reason = "unknown", detail = null } = {}) {
                    const fallback = this.fallback;

                    fallback.total += 1;
                    fallback.byReason[reason] = (fallback.byReason[reason] || 0) + 1;
                    fallback.byModule[module] = (fallback.byModule[module] || 0) + 1;

                    const event = {
                        module,
                        reason,
                        detail,
                        timestamp: new Date().toISOString()
                    };

                    fallback.events.push(event);

                    if (fallback.events.length > 50) {
                        fallback.events.shift();
                    }

                    console.warn("[Santis Observability] Graceful fallback recorded", {
                        total: fallback.total,
                        module,
                        reason,
                        detail,
                        timestamp: event.timestamp
                    });
                }
            };
        })();

        /**
         * ==========================================================================
         * 🧠 SOVEREIGN ENGINE: MEMORY MAP ENGINE (Phase 28.2 & 28.3)
         * ==========================================================================
         */
        class MemoryMapEngine {
            constructor(history) {
                this.history = history;
            }

            calculateDelta(current, next, key, group) {
                const a = current?.[group]?.[key];
                const b = next?.[group]?.[key];

                if (typeof a !== 'number' || typeof b !== 'number') return null;

                return b - a;
            }

            classifyTrend(delta, positiveLabel, negativeLabel, stableLabel = 'stable') {
                if (delta === null) return 'unknown';
                if (delta > 3) return positiveLabel;
                if (delta < -3) return negativeLabel;
                return stableLabel;
            }

            buildBridge(current, next) {
                const hrvDelta = this.calculateDelta(current, next, 'hrv', 'biometrics');
                const sleepDelta = this.calculateDelta(current, next, 'sleepScore', 'biometrics');
                const moodDelta = this.calculateDelta(current, next, 'moodScore', 'emotion');
                const recoveryDelta = this.calculateDelta(current, next, 'recoveryScore', 'biometrics');

                return {
                    from: current.date,
                    to: next.date,

                    deltas: {
                        hrvDelta,
                        sleepDelta,
                        moodDelta,
                        recoveryDelta
                    },

                    interpretation: {
                        biologicalTrend: this.classifyTrend(
                            recoveryDelta,
                            'recovery_improving',
                            'recovery_declining',
                            'recovery_stable'
                        ),

                        emotionalTrend: this.classifyTrend(
                            moodDelta,
                            'emotional_softening',
                            'emotional_tension',
                            'emotional_stable'
                        ),

                        nervousSystemTrend: this.classifyTrend(
                            hrvDelta,
                            'more_regulated',
                            'more_strained',
                            'neutral'
                        )
                    },

                    bridgeStrength: this.calculateBridgeStrength({
                        hrvDelta,
                        sleepDelta,
                        moodDelta,
                        recoveryDelta
                    }),

                    whisper: this.generateWhisper({
                        hrvDelta,
                        sleepDelta,
                        moodDelta,
                        recoveryDelta
                    })
                };
            }

            calculateBridgeStrength(deltas) {
                const values = Object.values(deltas).filter(v => typeof v === 'number');

                if (!values.length) return 0;

                const positiveSignals = values.filter(v => v > 0).length;
                return Number((positiveSignals / values.length).toFixed(2));
            }

            generateWhisper({ hrvDelta, sleepDelta, moodDelta, recoveryDelta }) {
                const parts = [];

                if (hrvDelta > 3) parts.push('HRV yükseldi');
                if (hrvDelta < -3) parts.push('HRV hassaslaştı');

                if (sleepDelta > 3) parts.push('uyku toparlandı');
                if (sleepDelta < -3) parts.push('uyku dalgalandı');

                if (moodDelta > 3) parts.push('duygusal ton yumuşadı');
                if (moodDelta < -3) parts.push('duygusal yük arttı');

                if (recoveryDelta > 3) parts.push('toparlanma güçlendi');
                if (recoveryDelta < -3) parts.push('beden daha fazla destek istedi');

                if (!parts.length) {
                    return 'Bugünün halkası dünle sakin bir süreklilik içinde kaldı.';
                }

                return `${parts.join(', ')}.`;
            }

            buildMap() {
                return this.history.map((node, index) => {
                    const next = this.history[index + 1];

                    return {
                        node,
                        bridgeToNext: next ? this.buildBridge(node, next) : null
                    };
                });
            }
        }

        // Concentric rings generator function
        function createRing(biometrics) {
            const { hrv, sleepScore, recoveryScore, breathDepth } = biometrics;
            
            const size = 110;
            const center = size / 2;
            
            const getStrokeDash = (value, radius) => {
                const circumference = 2 * Math.PI * radius;
                const strokeDashoffset = circumference - (value / 100) * circumference;
                return `stroke-dasharray="${circumference}" stroke-dashoffset="${strokeDashoffset}"`;
            };
            
            return `
                <div class="ring-visualizer" style="width: ${size}px; height: ${size}px;">
                    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                        <!-- Concentric Background circles -->
                        <circle cx="${center}" cy="${center}" r="44" stroke="rgba(255,255,255,0.02)" stroke-width="3" fill="none" />
                        <circle cx="${center}" cy="${center}" r="34" stroke="rgba(255,255,255,0.02)" stroke-width="3" fill="none" />
                        <circle cx="${center}" cy="${center}" r="24" stroke="rgba(255,255,255,0.02)" stroke-width="3" fill="none" />
                        <circle cx="${center}" cy="${center}" r="14" stroke="rgba(255,255,255,0.02)" stroke-width="3" fill="none" />

            static updateAtmosphere(atmosphere) {
                if (!atmosphere) return;

                console.log("🌀 [AtmosphereEngine] Ambient shift initiated:", atmosphere);

                const root = document.documentElement;

                // 1. Dynamic Background Aura Gradient
                let bgAura = 'rgba(212, 175, 55, 0.03)'; // Default gold
                if (atmosphere.emotionalTemperature === 'cool-still') {
                    bgAura = 'rgba(0, 229, 255, 0.02)'; // Cool Cyan
                } else if (atmosphere.emotionalTemperature === 'deep-rest') {
                    bgAura = 'rgba(168, 85, 247, 0.02)'; // Purple Calm
                } else if (atmosphere.emotionalTemperature === 'vibrant-glow') {
                    bgAura = 'rgba(16, 185, 129, 0.03)'; // Green Vitality
                } else if (atmosphere.emotionalTemperature === 'warm-still') {
                    bgAura = 'rgba(212, 175, 55, 0.03)'; // Warm Amber
                }
                root.style.setProperty('--santis-bg-aura', bgAura);

                // 2. Ambient Breathing Animation Speed
                // high coherence + low load = very slow breathing (8s cycle)
                // low coherence + high load = faster breathing (3.5s cycle)
                const breathDuration = 8 - (atmosphere.nervousSystemLoad * 4.5);
                root.style.setProperty('--santis-breathing-speed', `${breathDuration.toFixed(2)}s`);

                // 3. Ring Glow Intensity based on Coherence
                const glowSize = Math.max(2, Math.round(atmosphere.coherence * 8));
                root.style.setProperty('--santis-active-glow', `${glowSize}px`);
                
                let glowColor = 'rgba(212, 175, 55, 0.6)'; // Gold glow default
                if (atmosphere.emotionalTemperature === 'cool-still') glowColor = 'rgba(0, 229, 255, 0.7)';
                if (atmosphere.emotionalTemperature === 'deep-rest') glowColor = 'rgba(168, 85, 247, 0.7)';
                if (atmosphere.emotionalTemperature === 'vibrant-glow') glowColor = 'rgba(16, 185, 129, 0.7)';
                root.style.setProperty('--santis-active-glow-color', glowColor);

                // 4. Bridge Flow Direction and Speed
                let flowSpeed = '0s';
                let flowDirection = 'normal';

                if (atmosphere.recoveryField === 'ascending') {
                    flowSpeed = '2.2s';
                    flowDirection = 'reverse'; // Flows upward representing recovery ascending
                } else if (atmosphere.recoveryField === 'descending') {
                    flowSpeed = '2.8s';
                    flowDirection = 'normal';  // Flows downward
                } else if (atmosphere.recoveryField === 'stable') {
                    flowSpeed = '0s'; // Steady static kilit
                }

                root.style.setProperty('--santis-bridge-flow-speed', flowSpeed);
                root.style.setProperty('--santis-bridge-flow-direction', flowDirection);

                // Update flow state on DOM
                document.querySelectorAll('.context-bridge').forEach(bridge => {
                    if (flowSpeed !== '0s') {
                        bridge.classList.add('is-flowing');
                    } else {
                        bridge.classList.remove('is-flowing');
                    }
                });
            }
        }

        async function requestAureliaWhisper(memoryNode) {
            try {
                const response = await fetch('/api/v1/aurelia/whisper', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        date: memoryNode.date,
                        biometrics: {
                            hrv: memoryNode.biometrics.hrv,
                            sleepScore: memoryNode.biometrics.sleepScore,
                            recoveryScore: memoryNode.biometrics.recoveryScore,
                            breathDepth: memoryNode.biometrics.breathDepth
                        },
                        emotion: {
                            primary: memoryNode.emotion.primary,
                            moodScore: memoryNode.emotion.moodScore
                        },
                        ritual: {
                            dominantRitual: memoryNode.ritual.dominantRitual
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error('Aurelia whisper request failed');
                }

                return await response.json();
            } catch (error) {
                console.warn('⚠️ [Aurelia Bypass] Live endpoint unavailable, falling back to static diarist archive:', error.message);
                return {
                    whisper: memoryNode.diarist.whisper,
                    tone: memoryNode.diarist.tone,
                    risk: 'low',
                    source: 'static-archive'
                };
            }
        }

                            </div>
                            <span class="small-tag" style="background: rgba(16,185,129,0.1); color: #34d399; border-color: rgba(16,185,129,0.2);">
                                ${bridge.interpretation.nervousSystemTrend.replace(/_/g, ' ')}
                            </span>
                        </div>
                    </div>
                </div>
            `;
            
            // Re-apply reveal animation
            container.classList.remove('santis-refracted');
            void container.offsetWidth; // Trigger reflow
            container.classList.add('santis-refracted');
        }

        // Helper: Format Date beautifully
        function formatDate(dateStr) {
            const options = { day: '2-digit', month: 'short', year: 'numeric' };
            const date = new Date(dateStr);
            return date.toLocaleDateString('tr-TR', options).toUpperCase();
        }

        function isValidMemoryNode(node) {
            return node &&
                typeof node.date === 'string' &&
                node.biometrics &&
                node.emotion &&
                node.ritual &&
                node.environment &&
                node.diarist &&
                node.atmosphere;
        }

        async function loadMemoryNodes() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            try {
                const response = await fetch('/api/v1/memory/nodes', { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                if (!Array.isArray(data) || !data.every(isValidMemoryNode)) {
                    throw new Error('Invalid memory node contract');
                }

                console.log("📥 [SovereignMemory] Fetched temporal nodes from server:", data);
                return data;
            } catch (error) {
                clearTimeout(timeoutId);
                console.warn('⚠️ [SovereignMemory] Failed to fetch live memory nodes, falling back to static seed:', error.message);
                
                // Record Fallback Event Locally
                const reason = error.name === 'AbortError' ? 'network_timeout' : 
                               (error.message.includes('contract') ? 'invalid_contract' : 'fetch_error');
                               
                window.__SANTIS_OBSERVABILITY__?.recordFallback({
                    module: "sovereign_archive",
                    reason: reason,
                    detail: error.message
                });

                return historySeed;
            }
        }

        // Boot
        window.addEventListener('DOMContentLoaded', async () => {
            console.log("⏳ [MemoryMapEngine] Sovereign OS V28 bootloading...");
            
            // 1. Load data from Backend or Fallback
            const memoryData = await loadMemoryNodes();

            // 2. Initialize Engine with Memory Data
            const engine = new MemoryMapEngine(memoryData);
            memoryMap = engine.buildMap();
            
            // 3. Render UI
            renderTimeline();
            
            // 4. Auto-select first day node
            if (memoryMap.length > 0) {
                setTimeout(() => {
                    selectNode(memoryMap[0].node.date, 0);
                }, 200);
            }
        });
    </script>
</body>
</html>
