<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santis SpaOS | Hero Expansion Module</title>
  
  <link rel="stylesheet" href="/assets/vendor/swiper-bundle.min.css" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --santis-black: #050505;
      --santis-gold: #d4af37;
      --text-main: #f5f5f7;
      --text-muted: #888891;
      --transition-snappy: cubic-bezier(0.19, 1, 0.22, 1);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: var(--santis-black);
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      overflow: hidden; 
      user-select: none;
    }

    /* Arka Plan Aurası */
    .spaos-universe {
      position: relative;
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center;
    }

    /* =========================================
       SWIPER KARTLARI
       ========================================= */
    .swiper { width: 100%; padding: 40px 0; z-index: 5; }

    .swiper-slide {
      width: 320px; height: 460px;
      border-radius: 12px;
      overflow: hidden;
      display: flex; flex-direction: column;
      justify-content: flex-end; align-items: center;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.03);
      background: #0a0a0a;
      cursor: pointer; /* Tıklanabilir */
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .card-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }

    .card-gradient {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background: linear-gradient(to top, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.3) 50%, transparent 100%);
      z-index: 1;
    }

    .card-content {
      position: relative; z-index: 2; width: 100%; padding: 0 24px 30px 24px;
    }

    .card-badge { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.3em; color: var(--santis-gold); margin-bottom: 12px; }
    .card-title { font-family: 'Cinzel', serif; font-size: 24px; font-weight: 500; color: var(--text-main); margin: 0 0 12px 0; letter-spacing: 0.05em; }
    .card-desc { font-size: 12px; font-weight: 300; color: var(--text-muted); line-height: 1.6; margin: 0 0 24px 0; }
    .card-link { font-size: 11px; font-weight: 500; color: var(--santis-gold); letter-spacing: 0.2em; }

    /* =========================================
       HERO EXPANSION EKRANI (TAM EKRAN DETAY)
       ========================================= */
    .hero-view {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 9999;
      pointer-events: none;
      visibility: hidden;
    }

    .hero-view.active {
      pointer-events: auto;
      visibility: visible;
    }

    /* Animasyonu Taşıyan Kart İskeleti */
    .hero-dummy {
      position: absolute;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 transparent;
      transform-origin: center center;
      transition: all 0.6s var(--transition-snappy);
    }
    
    .hero-view.expanding .hero-dummy {
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100vh !important;
      border-radius: 0;
    }

    .hero-img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }

    .hero-gradient {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background: linear-gradient(to top, rgba(5,5,5,1) 0%, rgba(5,5,5,0.6) 50%, rgba(5,5,5,0.1) 100%);
      opacity: 0; transition: opacity 0.6s ease;
    }

    .hero-view.expanding .hero-gradient { opacity: 1; }

    /* Kapat Butonu */
    .btn-close {
      position: absolute; top: 40px; right: 40px;
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      color: #fff; font-size: 18px; line-height: 1;
      cursor: pointer; z-index: 10;
      display: flex; justify-content: center; align-items: center;
      opacity: 0; transform: translateY(-20px);
      transition: all 0.6s ease 0.4s;
    }
    .hero-view.expanding .btn-close { opacity: 1; transform: translateY(0); }

    /* Detay İçeriği */
    .hero-details {
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      padding: 60px;
      display: flex; flex-direction: column; align-items: flex-start;
      z-index: 5;
    }
    .hero-details > * {
      opacity: 0; transform: translateY(30px);
      transition: all 0.6s var(--transition-snappy);
    }
    .hero-view.expanding .hero-details > * { opacity: 1; transform: translateY(0); }

    /* Zincirleme Geliş */
    .hero-view.expanding .hero-details .h-badge { transition-delay: 0.2s; }
    .hero-view.expanding .hero-details .h-title { transition-delay: 0.3s; }
    .hero-view.expanding .hero-details .h-desc { transition-delay: 0.4s; }
    .hero-view.expanding .hero-details .h-features { transition-delay: 0.5s; }
    .hero-view.expanding .hero-details .h-action { transition-delay: 0.6s; }

    .h-badge { font-size: 12px; font-weight: 600; letter-spacing: 0.4em; color: var(--santis-gold); margin-bottom: 16px; text-transform: uppercase; }
    .h-title { font-family: 'Cinzel', serif; font-size: 56px; font-weight: 400; margin: 0 0 20px 0; }
    .h-desc { max-width: 600px; font-size: 16px; font-weight: 300; color: rgba(255,255,255,0.7); line-height: 1.8; margin-bottom: 40px; }
    
    .h-features { display: flex; gap: 40px; margin-bottom: 50px; }
    .feature-item { display: flex; flex-direction: column; gap: 8px; }
    .f-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; }
    .f-val { font-size: 16px; font-family: 'Cinzel', serif; color: #fff; }

    /* Özel Rezevasyon Butonu */
    .btn-reserve {
      background: var(--santis-gold); color: #000;
      border: none; padding: 18px 40px;
      font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2em;
      cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; gap: 12px;
    }
    .btn-reserve:hover { background: #fff; box-shadow: 0 10px 30px rgba(255,255,255,0.2); }

  </style>

<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
</head>
<body>

  <!-- Ana Arayüz (Swiper) -->
  <div class="spaos-universe">
      <div style="text-align: center; margin-bottom: 2vh; font-family: 'Cinzel'; font-size: 24px; color: #D4AF37;">
          Sovereign Expansion Test
      </div>
    <div class="swiper mySovereignSwiper">
      <div class="swiper-wrapper" id="spaos-wrapper">
        
        <!-- Kart 1 -->
        <div class="swiper-slide" onclick="openHero(this)">
          <img decoding="async" width="1024" height="1024" src="https://images.unsplash.com/photo-1600334089648-b0d9d3028eb2?q=80&w=600&auto=format&fit=crop" class="card-img" loading="lazy">
          <div class="card-gradient"></div>
          <div class="card-content">
            <span class="card-badge">İMZA</span>
            <h3 class="card-title">AURA AROMATERAPİ</h3>
            <p class="card-desc">Sıcak esansiyel yağlarla zihinsel frekans dengelemesi.</p>
            <span class="card-link">RİTÜELİ KEŞFET</span>
          </div>
          <!-- Gizli Veri -->
          <div class="card-data" style="display:none;" data-dur="60 DAKİKA" data-price="€ 150" data-fulldesc="Santis imza masajı, bedeninizi ve zihninizi dünyanın dört bir yanından toplanmış nadir bitki esanslarıyla şifalandırır. Klasik masaj tekniklerinin ötesine geçen bu ritüel, sıcaklık ve basının mükemmel uyumuyla sinir sisteminizi yeniden başlatır."></div>
        </div>

        <!-- Kart 2 -->
        <div class="swiper-slide" onclick="openHero(this)">
          <img decoding="async" width="1024" height="1024" src="https://images.unsplash.com/photo-1544161515-4ab6ce6db874?q=80&w=600&auto=format&fit=crop" class="card-img" loading="lazy">
          <div class="card-gradient"></div>
          <div class="card-content">
            <span class="card-badge">MİRAS</span>
            <h3 class="card-title">OSMANLI RİTÜELİ</h3>
            <p class="card-desc">Geleneksel kese ve sıcak köpük ile hücresel yenilenme.</p>
            <span class="card-link">RİTÜELİ KEŞFET</span>
          </div>
          <!-- Gizli Veri -->
          <div class="card-data" style="display:none;" data-dur="45 DAKİKA" data-price="€ 120" data-fulldesc="Kızgın mermer üzerinde başlayan bir serüven. Geleneksel kese ile ölü derilerin atılması ve nemlendirici gül özlü sıcak köpükle sarmalanmanın rahatlatıcı etkisi. Yüzyılların mirası modern bir lüks ile yeniden doğuyor."></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hero Expansion Katmanı -->
  <div class="hero-view" id="heroView">
    <div class="hero-dummy" id="heroDummy">
      
      <div class="hero-gradient"></div>
      
      <!-- Detaylar -->
      <div class="hero-details">
        <div class="h-badge" id="heroBadge">CATEGORY</div>
        <h1 class="h-title" id="heroTitle">Ritual Title</h1>
        <p class="h-desc" id="heroDesc">Full description goes here...</p>
        
        <div class="h-features">
          <div class="feature-item">
            <span class="f-label">SÜRE</span>
            <span class="f-val" id="heroDur">--</span>
          </div>
          <div class="feature-item">
            <span class="f-label">ÜCRET</span>
            <span class="f-val" id="heroPrice">--</span>
          </div>
        </div>

        <div class="h-action">
          <button class="btn-reserve">ÖZEL REZERVASYON <span style="font-size:16px;">→</span></button>
        </div>
      </div>

    </div>
    <button class="btn-close" onclick="closeHero()">✕</button>
  </div>


  <script type="module" src="/assets/vendor/swiper-bundle.min.js" defer></script>
  <script>
    /* Swiper Kurulumu */
    const swiper = new Swiper('.mySovereignSwiper', {
      effect: 'coverflow',
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: 'auto',
      coverflowEffect: {
        rotate: 0, stretch: 0, depth: 150, modifier: 2.5, slideShadows: false,
      }
    });

    /* HERO EXPANSION MOTORU (FLIP TEKNİĞİ) */
    const heroView = document.getElementById('heroView');
    const dummy = document.getElementById('heroDummy');
    let activeCard = null;

    function openHero(card) {
      // Eğer arkaya düşmüş pasif bir karta tıkladıysak, önce onu merkeze al
      if(!card.classList.contains('swiper-slide-active')) {
        const index = Array.from(card.parentNode.children).indexOf(card);
        swiper.slideTo(index);
        return; // Merkezde değilse açılmasın, sadece odaklansın
      }

      activeCard = card;
      const rect = card.getBoundingClientRect();
      const imgTarget = card.querySelector('.card-img').src;
      const title = card.querySelector('.card-title').innerText;
      const badge = card.querySelector('.card-badge').innerText;
      
      const dataNode = card.querySelector('.card-data');
      const dur = dataNode.getAttribute('data-dur');
      const price = dataNode.getAttribute('data-price');
      const fullDesc = dataNode.getAttribute('data-fulldesc');

      // 1. Verileri Hero Ekranına Bas
      document.getElementById('heroImg').src = imgTarget;
      document.getElementById('heroTitle').innerText = title;
      document.getElementById('heroBadge').innerText = badge;
      document.getElementById('heroDesc').innerText = fullDesc;
      document.getElementById('heroDur').innerText = dur;
      document.getElementById('heroPrice').innerText = price;

      // 2. Dummy Kartı, Tıklanan Kartın Piksellerine Eşitle (Başlangıç Pozisyonu)
      dummy.style.top = rect.top + 'px';
      dummy.style.left = rect.left + 'px';
      dummy.style.width = rect.width + 'px';
      dummy.style.height = rect.height + 'px';

      // 3. Arka plandaki ana kartı gizle ve Hero'yu görünür yap
      card.style.opacity = '0';
      heroView.classList.add('active');

      // 4. Tarayıcının çizimi tamamlaması için 1 Frame bekle, ardından Expanding Class'ını ver
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          heroView.classList.add('expanding'); // Bu class tüm transition'ları tetikler (tam ekran yapar)
        });
      });
    }

    function closeHero() {
      if(!activeCard) return;
      const rect = activeCard.getBoundingClientRect();

      // Expanding class'ını sil (Küçülme animasyonu başlar)
      heroView.classList.remove('expanding');

      // Orijinal kartın yerine geri küçült
      dummy.style.top = rect.top + 'px';
      dummy.style.left = rect.left + 'px';
      dummy.style.width = rect.width + 'px';
      dummy.style.height = rect.height + 'px';

      // Animasyon bitince (600ms) her şeyi temizle
      setTimeout(() => {
        heroView.classList.remove('active');
        activeCard.style.opacity = '1';
        activeCard = null;
      }, 600);
    }
  </script>
