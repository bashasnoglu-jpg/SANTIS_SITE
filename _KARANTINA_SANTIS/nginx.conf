server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Güvenlik Header'ları ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff font/woff2;

    # ── Vite Hashli Varlıklar: 1 Yıl Immutable ───────────────────────────────
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Web Workers: Asla cache'leme ──────────────────────────────────────────
    location ~* workers/.*\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # ── HTML: Her zaman taze ──────────────────────────────────────────────────
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # ── API Proxy → FastAPI backend ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── SPA Fallback ──────────────────────────────────────────────────────────
    # tr/ → /tr/index.html, en/ → /en/index.html vb.
    location / {
        try_files $uri $uri/ $uri.html /tr/index.html;
    }

    # ── 404 ───────────────────────────────────────────────────────────────────
    error_page 404 /tr/index.html;
}
