<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Santis — Bağlantı Bekleniyor</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0a0a0a;
      color: #d6d6d8;
      font-family: Arial, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .shell {
      max-width: 560px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      background: rgba(255,255,255,0.02);
      padding: 28px;
      box-sizing: border-box;
    }
    .kicker {
      letter-spacing: .24em;
      text-transform: uppercase;
      font-size: 12px;
      color: #c6a96b;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.05;
    }
    p {
      margin: 0;
      color: #a8a8ad;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="kicker">Santis</div>
    <h1>Bağlantı geçici olarak bekleniyor.</h1>
    <p>İçerik yeniden senkronize edildiğinde deneyim kaldığı yerden devam edecektir.</p>
  </main>
</body>
</html>
