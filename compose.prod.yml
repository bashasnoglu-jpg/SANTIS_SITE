services:
  # ── API: Production Backend ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      - SANTIS_ENV=production
      - SANTIS_API_APP=app.main:app
      # DATABASE_URL/REDIS_URL must be injected via secure Secrets Manager at runtime

    ports:
      - "8000:8000"
    # Enforce strict secure read-only container filesystem boundaries
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  # ── WEB: Production Public Static Page ──────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "8080:8080"
    # Enforce strict secure read-only container filesystem boundaries
    read_only: true
    volumes:
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/run
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /tmp
    restart: unless-stopped
    depends_on:
      - api

  # ── ADMIN PANEL: Production Dashboard SPA ───────────────────────────────────
  admin-panel:
    build:
      context: .
      dockerfile: docker/admin-panel/Dockerfile
    ports:
      - "8081:8080"
    # Enforce strict secure read-only container filesystem boundaries
    read_only: true
    volumes:
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/run
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /tmp
    restart: unless-stopped
    depends_on:
      - api




  # ── DATA LAYER: Production PostgreSQL 16 ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: santis
      POSTGRES_USER: santis
      # SECRETS WARNING: In production, dynamically inject this secret from vault or secure container environment.
      POSTGRES_PASSWORD: santis_prod_secure_password
    volumes:
      - santis_postgres_prod:/var/lib/postgresql/data
    restart: unless-stopped

  # ── DATA LAYER: Production Redis Cache ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    # Exposing redis is disabled in production to isolate data boundaries within santis_network
    restart: unless-stopped

volumes:
  santis_postgres_prod:
    name: santis_postgres_prod
