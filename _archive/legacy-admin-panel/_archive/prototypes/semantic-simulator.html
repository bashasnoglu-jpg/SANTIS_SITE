<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santis Semantic Simulator</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="/assets/vendor/react.development.js" defer></script>
    <script crossorigin src="/assets/vendor/react-dom.development.js" defer></script>
    <!-- Babel -->
    <script src="/assets/vendor/babel.min.js" defer></script>
    <!-- Tailwind CSS -->
    <script src="/assets/vendor/cdn.tailwindcss.com.js" defer></script>
    
    <!-- Engine Injection -->
    <script src="../assets/js/core/santis-semantic-engine.js" defer></script>

    <style>
        body {
            background-color: #05080f;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #151030 0%, transparent 40%),
                              radial-gradient(circle at 10% 80%, #001f3f 0%, transparent 40%);
        }
        * { box-sizing: border-box; }
        
        .bg-glass {
            background: rgba(15, 20, 30, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .bar-track {
            background: rgba(255, 255, 255, 0.05);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            width: 100%;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .axis-cyber { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        .axis-fire { color: #ff5533; text-shadow: 0 0 10px rgba(255,85,51,0.5); }
        .axis-void { color: #b066ff; text-shadow: 0 0 10px rgba(176,102,255,0.5); }
        .axis-tox { color: #00ff66; text-shadow: 0 0 10px rgba(0,255,102,0.5); }

        .fill-cyber { background: linear-gradient(90deg, #0088ff, #00ffcc); box-shadow: 0 0 15px #00ffcc; }
        .fill-fire { background: linear-gradient(90deg, #bb2200, #ff5533); box-shadow: 0 0 15px #ff5533; }
        .fill-void { background: linear-gradient(90deg, #5500aa, #b066ff); box-shadow: 0 0 15px #b066ff; }
        .fill-tox { background: linear-gradient(90deg, #008822, #00ff66); box-shadow: 0 0 15px #00ff66; }

        .card-enter {
            animation: slideUp 0.4s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        textarea {
            outline: none;
            resize: none;
        }
        textarea:focus {
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            border-color: rgba(0, 255, 204, 0.4);
        }
    </style>
<script src="/assets/js/core/santis-ws-orchestrator.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Dashboard = () => {
            const [query, setQuery] = useState('');
            const [intent, setIntent] = useState([0.25, 0.25, 0.25, 0.25]); // default balanced
            const [results, setResults] = useState([]);

            useEffect(() => {
                // Wait for the window.QuantumSearch from standard script injection to be available
                if (!window.QuantumSearch) {
                    window.QuantumSearch = new window.SantisSemanticEngine();
                }

                if (query.trim().length > 0) {
                    const output = window.QuantumSearch.search(query);
                    setIntent(output.intent);
                    setResults(output.results.filter(r => r.matchPercentage > 20)); // Only show strong matches
                } else {
                    setIntent([0.25, 0.25, 0.25, 0.25]);
                    setResults([]);
                }
            }, [query]);

            return (
                <div className="min-h-screen p-6 max-w-5xl mx-auto flex flex-col gap-6">
                    {/* UI Header */}
                    <div className="bg-glass rounded-xl p-5 flex items-center justify-between">
                        <div>
                            <h1 className="text-xl font-bold tracking-widest text-[#00ffcc] drop-shadow-[0_0_10px_rgba(0,255,204,0.4)]">
                                🌌 SANTIS NLP ENGINE
                            </h1>
                            <p className="text-xs tracking-[0.3em] text-gray-500 mt-1 uppercase">Intent Matrix Active</p>
                        </div>
                        <div className="w-3 h-3 rounded-full bg-[#00ffcc] animate-pulse drop-shadow-[0_0_10px_#00ffcc]"></div>
                    </div>

                    {/* Top Input Area */}
                    <div className="bg-glass rounded-xl p-6 relative">
                        <div className="absolute top-0 right-4 px-3 py-1 bg-[#00ffcc] text-black font-bold text-[10px] tracking-widest rounded-b-md">
                            GUEST INPUT
                        </div>
                        <textarea 
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                            placeholder="Sizi nasıl hissediyorsunuz? Vücudunuz size ne söylüyor? (Örn: Bugün tüm gün masa başındaydım, boynum çok tutuldu ve çok yorgunum...)"
                            className="w-full bg-black/40 text-gray-200 p-6 rounded-lg font-sans text-lg border border-gray-800 transition-all h-32 leading-relaxed"
                        ></textarea>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1">
                        {/* The Brain (Intent Space) */}
                        <div className="bg-glass rounded-xl p-6 flex flex-col justify-center">
                            <h2 className="text-xs tracking-[0.2em] text-gray-400 mb-6 uppercase border-b border-gray-800 pb-2">🧠 4D Intent Space Vector</h2>
                            
                            <div className="space-y-6">
                                {/* Axis 1 */}
                                <div>
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="axis-cyber font-bold tracking-wider">RELAXATION (Rahatlama)</span>
                                        <span className="text-gray-400">{(intent[0] * 100).toFixed(0)}%</span>
                                    </div>
                                    <div className="bar-track"><div className="bar-fill fill-cyber" style={{ width: `${intent[0] * 100}%` }}></div></div>
                                </div>
                                {/* Axis 2 */}
                                <div>
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="axis-fire font-bold tracking-wider">RECOVERY (İyileşme/Ağrı)</span>
                                        <span className="text-gray-400">{(intent[1] * 100).toFixed(0)}%</span>
                                    </div>
                                    <div className="bar-track"><div className="bar-fill fill-fire" style={{ width: `${intent[1] * 100}%` }}></div></div>
                                </div>
                                {/* Axis 3 */}
                                <div>
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="axis-void font-bold tracking-wider">RADIANCE (Işıltı/Cilt)</span>
                                        <span className="text-gray-400">{(intent[2] * 100).toFixed(0)}%</span>
                                    </div>
                                    <div className="bar-track"><div className="bar-fill fill-void" style={{ width: `${intent[2] * 100}%` }}></div></div>
                                </div>
                                {/* Axis 4 */}
                                <div>
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="axis-tox font-bold tracking-wider">DETOX (Arınma)</span>
                                        <span className="text-gray-400">{(intent[3] * 100).toFixed(0)}%</span>
                                    </div>
                                    <div className="bar-track"><div className="bar-fill fill-tox" style={{ width: `${intent[3] * 100}%` }}></div></div>
                                </div>
                            </div>
                        </div>

                        {/* Results (Catalog Mapping) */}
                        <div className="bg-glass rounded-xl p-6">
                            <h2 className="text-xs tracking-[0.2em] text-gray-400 mb-6 uppercase border-b border-gray-800 pb-2">🔮 Quantum Mapping Results</h2>
                            
                            <div className="space-y-4">
                                {results.length === 0 ? (
                                    <div className="text-gray-600 text-sm font-sans flex items-center justify-center h-32 border border-dashed border-gray-800 rounded-lg">
                                        Ağ analizi bekleniyor...
                                    </div>
                                ) : (
                                    results.slice(0, 3).map((res, index) => (
                                        <div key={res.id} className="card-enter bg-black/50 border border-gray-800 rounded-lg p-4 flex items-center justify-between" style={{ animationDelay: `${index * 0.1}s` }}>
                                            <div className="font-sans text-lg text-gray-200 font-medium">
                                                {res.name}
                                                {index === 0 && <span className="ml-3 text-[9px] uppercase tracking-widest bg-[#00ffcc]/20 text-[#00ffcc] px-2 py-1 rounded">Best Match</span>}
                                            </div>
                                            <div className={`text-2xl font-black ${index === 0 ? 'text-[#00ffcc] drop-shadow-[0_0_8px_rgba(0,255,204,0.5)]' : 'text-gray-500'}`}>
                                                %{Number(res.matchPercentage).toFixed(0)}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>

<!-- SOVEREIGN OS BOOTLOADER (V35 KERNEL) -->
<script type="module" src="/assets/js/boot/santis-bootloader.js?v=V35_OMEGA" defer></script>
</body>
</html>
