<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>Santis OS v3.0 | Merkez</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body style="margin: 0; background: #050505; color: white; font-family: sans-serif; overflow-x: hidden;">
    <canvas id="santis-gl" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>
    <div class="nav-overlay" id="santis-nav-overlay"></div>
    <nav class="sovereign-nav" id="santis-main-nav">
        <!-- Brand Bar -->
        <div class="sovereign-brand-bar">
            <div class="sovereign-nav-container" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 40px;">
                <a class="sovereign-logo" href="/" style="text-decoration: none; color: white;">
                    <div style="font-family: 'Cinzel', serif; font-size: 24px; letter-spacing: 0.1em;">SANTIS</div>
                    <div style="font-family: 'Outfit', sans-serif; font-size: 10px; letter-spacing: 0.3em; color: #D4AF37;">SPA & THERAPY</div>
                </a>
                <div class="sovereign-links" style="display: flex; gap: 30px;">
                    <a class="sovereign-link-item liquid-trigger" href="/santis-world" style="color: white; text-decoration: none;">Santis World</a>
                    <a class="sovereign-link-item liquid-trigger" href="/galeri" style="color: white; text-decoration: none;">Galeri</a>
                    <a class="sovereign-link-item liquid-trigger" href="/hakkimizda" data-menu="hakkimizda" style="color: white; text-decoration: none;">Hakkımızda</a>
                    <a class="sovereign-link-item liquid-trigger" href="/magaza" style="color: white; text-decoration: none;">Mağaza</a>
                </div>
                <!-- Actions -->
                <div class="sovereign-actions" style="display: flex; align-items: center; gap: 20px;">
                    <a href="/rezervasyon" style="color: #D4AF37; text-decoration: none; font-size: 14px; letter-spacing: 0.1em; border: 1px solid #D4AF37; padding: 8px 16px; border-radius: 4px;">Rezervasyon</a>
                    <div id="hamburger" style="width: 24px; height: 16px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;">
                        <span style="height: 2px; background: white; width: 100%;"></span>
                        <span style="height: 2px; background: white; width: 100%;"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Service Bar -->
        <div class="sovereign-service-bar" style="border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div class="sovereign-nav-container" style="display: flex; justify-content: center; gap: 60px; padding: 12px 0;">
                <a class="service-link liquid-trigger" href="/hamam" data-menu="hamam" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;">Hamam</a>
                <a class="service-link liquid-trigger" href="/masaj" data-menu="masajlar" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;">Masaj</a>
                <a class="service-link liquid-trigger" href="/cilt-bakimi" data-menu="cilt" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;">Cilt Bakımı</a>
                <a class="service-link liquid-trigger" href="/rituals" data-menu="rituals" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;">Ritüeller</a>
            </div>
        </div>
    </nav>

    <!-- YENİ: Reaktif Mega Menu Tetikleyicisi -->
    <button id="menu-trigger" data-spatial="true" style="position: fixed; top: 30px; right: 40px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px 24px; border-radius: 30px; cursor: pointer; transform: translateZ(30px); z-index: 9999; backdrop-filter: blur(10px);">Menü 🦅</button>

    <main id="santis-app-content" style="position: relative; z-index: 10; padding-top: 130px; text-align: center; min-height: 200vh;">

        <!-- SPATIAL CARD DEMO -->
        <div data-spatial="true" style="margin: 100px auto; width: 350px; padding: 50px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; backdrop-filter: blur(16px); color: white; text-align: center; position: relative; box-shadow: 0 40px 80px rgba(0,0,0,0.5);">
            <div class="spatial-glare" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 30px; pointer-events: none; opacity: 0;"></div>
            <h2 style="transform: translateZ(50px); margin: 0; display: inline-block;">Santis Vision</h2>
            <p style="opacity: 0.7; transform: translateZ(30px); display: inline-block;">Hacimsel arayüz fiziği aktif.</p>
        </div>

        <h1 style="margin-top: 100px;">Santis OS v3.0 Karargahı</h1>
        <p style="opacity: 0.7;">Sayfayı aşağı kaydır, 3D obje hareket edecek.</p>
    </main>
    
    <script type="module" src="/src/main.ts"></script>
