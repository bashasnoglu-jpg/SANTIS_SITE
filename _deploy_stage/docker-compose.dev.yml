# 👑 SOVEREIGN OMNIVERSE DEV CLUSTER
# Node.js backend'i (.env ile) lokalde çalıştırırken gereken veritabanları

version: "3.9"

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: santis_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: santis_db
      POSTGRES_USER: santis
      POSTGRES_PASSWORD: sovereign_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis-dev:
    image: redis:7-alpine
    container_name: santis_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
