<script>
document.addEventListener('DOMContentLoaded', () => {
    const filters = document.querySelectorAll('.filter-bar .santis-chip');
    const cards = document.querySelectorAll('.gal-card');

    filters.forEach(btn => {
        btn.addEventListener('click', () => {
            filters.forEach(f => f.classList.remove('is-active'));
            btn.classList.add('is-active');

            const filter = btn.getAttribute('data-filter');

            cards.forEach(card => {
                if (filter === 'all' || card.getAttribute('data-category') === filter) {
                    card.style.display = 'block';
                    // Trigger reflow
                    void card.offsetWidth;
                    card.style.opacity = '1';
                    card.style.transform = 'scale(1)';
                } else {
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.8)';
                    setTimeout(() => { 
                        // Double check if still not matching before hiding (prevent fast click bugs)
                        if(btn.classList.contains('is-active') && card.style.opacity === '0') {
                            card.style.display = 'none'; 
                        }
                    }, 400); 
                }
            });
        });
    });
    // ── LIGHTBOX LOGIC ──
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightboxImg');
    const lbClose = document.querySelector('.lightbox-close');

    cards.forEach(card => {
        card.addEventListener('click', () => {
            const img = card.querySelector('img');
            if(img) {
                lbImg.src = img.src;
                lbImg.alt = img.alt;
                lightbox.style.display = 'flex';
                setTimeout(() => { lightbox.classList.add('is-active'); if(lbImg.style) { lbImg.style.opacity = '1'; lbImg.style.transform = 'scale(1)'; } }, 10);
            }
        });
    });

    function closeLightbox() {
        lightbox.classList.remove('is-active');
        if(lbImg.style) { lbImg.style.opacity = '0'; lbImg.style.transform = 'scale(0.9)'; }
        setTimeout(() => { lightbox.style.display = 'none'; }, 400);
    }

    if(lbClose) lbClose.addEventListener('click', closeLightbox);
    if(lightbox) lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && lightbox.style.display === 'flex') closeLightbox(); });\n});\n</script>
