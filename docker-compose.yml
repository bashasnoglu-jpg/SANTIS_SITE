version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: santis-sovereign-db
    environment:
      POSTGRES_USER: santis_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: santis_core
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santis_admin -d santis_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion-api:
    build: .
    container_name: santis-ingestion-api
    ports:
      - "3030:3030"
      - "4040:4040"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://santis_admin:${POSTGRES_PASSWORD}@postgres:5432/santis_core
      - ADMIN_SECRET_TOKEN=${ADMIN_SECRET_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  quality-gate:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    container_name: santis-quality-gate
    working_dir: /app
    volumes:
      - ./:/app
    command: ["pnpm", "run", "test:quality:runtime"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

volumes:
  pgdata:
