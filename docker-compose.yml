version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: santis-sovereign-db
    environment:
      POSTGRES_USER: santis_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: santis_core
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  quality-gate:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    container_name: santis-quality-gate
    working_dir: /app
    volumes:
      - ./:/app
    command: ["npm", "run", "test:quality:runtime"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

volumes:
  pgdata:
