<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santis OS — Sovereign Mode</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #d1d1d1;
            --accent-color: #8c8c8c;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            letter-spacing: 0.05em;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
            animation: fadeIn 2s ease-in-out;
        }
        .logo {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 3rem;
            opacity: 0.6;
        }
        h1 {
            font-weight: 300;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #fff;
        }
        p {
            font-weight: 300;
            font-size: 0.9rem;
            line-height: 1.6;
            opacity: 0.8;
        }
        .status {
            margin-top: 3rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .dot {
            width: 4px;
            height: 4px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Santis OS</div>
        <h1>Sovereign Local Mode</h1>
        <p>Bağlantınız şu an için kesildi. Deneyiminiz kasanızdaki verilerle yerel modda devam ediyor.</p>
        <div class="status">
            <span class="dot"></span>
            Disconnected but Stable
        </div>
    </div>
</body>
</html>
