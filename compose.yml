services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - api

  admin-panel:
    build:
      context: .
      dockerfile: docker/admin-panel/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      - api


  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: santis
      POSTGRES_USER: santis
      POSTGRES_PASSWORD: santis_dev_password
    volumes:
      - santis_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"

volumes:
  santis_postgres:
