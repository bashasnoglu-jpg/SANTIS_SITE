version: '3.8'

services:
  # ── DATABASE: PostgreSQL 16 ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: santis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-santis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-santis_core}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - santis_network

  # ── CACHE: Redis 7 ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: santis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - santis_network

  # ── API: FastAPI Python Backend ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: santis-api
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-santis_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-santis_core}
      - REDIS_URL=redis://redis:6379/0
      - SANTIS_API_APP=${SANTIS_API_APP:-app.main:app}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - santis_network

  # ── ADMIN PANEL: Admin Dashboard Static Nginx Server ──────────────────────
  admin-panel:
    build:
      context: .
      dockerfile: docker/admin-panel/Dockerfile
    container_name: santis-admin-panel
    depends_on:
      - api
    networks:
      - santis_network

  # ── WEB: Public Static Nginx Web Server (Proxy and Edge Entrypoint) ────────
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: santis-web
    ports:
      - "80:80"
    depends_on:
      - api
      - admin-panel
    networks:
      - santis_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  santis_network:
    driver: bridge
