<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SDCR OMEGA HARNESS</title>

<style>
body {
  background: #050505;
  color: #00ff9f;
  font-family: monospace;
  margin: 0;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  border: 1px solid #00ff9f22;
  padding: 15px;
  border-radius: 10px;
}

#bar {
  height: 20px;
  background: #111;
  border: 1px solid #00ff9f33;
}

#fill {
  height: 100%;
  width: 0%;
  background: lime;
  transition: width 0.2s;
}

.log {
  height: 300px;
  overflow-y: auto;
  font-size: 12px;
}

.red { color: red; }
.orange { color: orange; }
.green { color: #00ff9f; }

button {
  margin: 4px;
}
</style>
</head>

<body>

<h1>🧠 SDCR LIVE HARNESS</h1>

<div class="grid">

<div class="card">
<h3>SSS</h3>
<div id="bar"><div id="fill"></div></div>
<div id="sss">0</div>
</div>

<div class="card">
<h3>Controls</h3>
<button onclick="assassin.startApocalypse()">APOCALYPSE</button>
<button onclick="assassin.ceasefire()">CEASEFIRE</button>
<br>
<button onclick="assassin.injectCPUChoke()">CPU</button>
<button onclick="assassin.injectMemoryLeak()">MEM</button>
<button onclick="assassin.triggerNetworkKillSwitch()">NET OFF</button>
<button onclick="assassin.ceasefire()">NET ON</button>
<button onclick="assassin.triggerPanicAttack(900)">SPIKE</button>
</div>

<div class="card">
<h3>Modules</h3>
<div id="modules"></div>
</div>

<div class="card">
<h3>Blackbox</h3>
<button onclick="clearLog()">CLEAR</button>
<button onclick="exportLog()">EXPORT</button>
<div class="log" id="log"></div>
</div>

</div>

<!-- Load Organ Scripts -->
<script type="module" src="system/santis-telemetry-pipeline.js"></script>
<script type="module" src="system/santis-chaos-monkey.js"></script>
<script type="module" src="system/santis-cortex-core.js"></script>
<script type="module" src="system/santis-blackbox-recorder.js"></script>

<script>
setTimeout(() => {
    // Wiring the instances after Organ Scripts execute
    const assassin = window.SDCR?.Chaos || window.__SDCR_ASSASSIN__;
    const cortex = window.SDCR?.Cortex || window.__CORTEX__;
    const blackbox = window.__SDCR_BLACKBOX__;

    window.assassin = assassin;

    if (cortex) {
      // MODULES
      cortex.registerDNA('core', [], () => console.log('Core Loaded'));

      cortex.registerDNA('heavy-ui', ['core'], () => {
        return new Promise(resolve => setTimeout(() => resolve({ __sdcr_amputated: false }), 200));
      });

      cortex.boot();
    }

    // SW
    if (navigator.serviceWorker) {
      navigator.serviceWorker.register('./santis-reality-sw.js');
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data?.type === 'BLACKBOX_LOG') {
          blackbox?.record('INTERCEPTOR', e.data.action, e.data.reason, e.data.meta);
        }
      });
    }

    // UI refs
    const fill = document.getElementById('fill');
    const sssEl = document.getElementById('sss');
    const logEl = document.getElementById('log');
    const modulesEl = document.getElementById('modules');

    // SSS BAR
    setInterval(() => {
      const sss = window.__SANTIS_SSS__ || (window.SDCR?.Sensor?.sss) || 0;

      fill.style.width = (sss / 10) + '%';
      sssEl.textContent = sss.toFixed(0);

      if (sss > 600) fill.style.background = 'red';
      else if (sss > 200) fill.style.background = 'orange';
      else fill.style.background = 'lime';

    }, 200);

    // MODULE VIEW
    if (cortex) {
      setInterval(() => {
        modulesEl.innerHTML = '';

        for (let id of cortex.registry.keys()) {
          const div = document.createElement('div');
          
          let amputated = false;
          for (const mod of cortex.amputatedModules) {
            if (mod.id === id) amputated = true;
          }

          div.textContent = `${id} → ${amputated ? 'AMPUTATED' : 'ALIVE'}`;
          div.className = amputated ? 'red' : 'green';

          modulesEl.appendChild(div);
        }
      }, 400);
    }

    // BLACKBOX STREAM
    setInterval(() => {
        if(!blackbox) return;
        logEl.innerHTML = '';
        blackbox.tape.forEach(e => {
            const div = document.createElement('div');

            let color = 'green';
            if (e.action.includes('AMPUTATE') || e.action.includes('CHOKE') || e.action.includes('LEAK')) color = 'red';
            else if (e.action.includes('RESURRECT')) color = 'green';
            else if (e.sss > 200) color = 'orange';

            div.className = color;
            div.textContent = `[${Math.floor(e.t)}] ${e.actor} -> ${e.action}`;

            logEl.appendChild(div);
        });
        logEl.scrollTop = logEl.scrollHeight;
    }, 500);

    // controls
    window.clearLog = () => {
      if(blackbox) blackbox.tape = [];
    };

    window.exportLog = () => {
      if(blackbox) {
          const data = blackbox.exportDNA();
          console.log(data);
          alert("DNA Exported to Console!");
      }
    };
}, 500); // 500ms startup delay
</script>

</body>
</html>
