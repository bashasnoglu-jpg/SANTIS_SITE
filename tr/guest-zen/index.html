<body class="solid-nav-page" data-page="guest-zen">

    <main id="sovereign-page-root" style="padding-top: 140px; padding-bottom: 80px; position: relative; z-index: 2;">
        <div class="santis-container max-w-[1200px] mx-auto px-6">
            
            <!-- Skeleton Loader State -->
            <div id="zen-skeleton" class="animate-pulse">
                <div class="h-12 bg-gray-800 rounded w-1/3 mb-4"></div>
                <div class="h-6 bg-gray-800 rounded w-1/4 mb-12"></div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="h-64 bg-gray-800 rounded-xl"></div>
                    <div class="h-64 bg-gray-800 rounded-xl"></div>
                    <div class="h-64 bg-gray-800 rounded-xl"></div>
                </div>
            </div>

            <!-- Live Data State -->
            <div id="zen-dashboard" style="display: none; opacity: 0; transition: opacity 0.8s ease;">
                <div class="mb-12">
                    <h1 class="text-4xl md:text-5xl font-playfair zen-brand mb-2">Hoş Geldiniz, <span id="zen-guest-name">...</span></h1>
                    <p id="zen-smart-greeting" class="text-gray-400 text-lg">Sovereign Lounge'a giriş yapılıyor...</p>
                </div>

                <div class="santis-bento-universe grid grid-cols-1 md:grid-cols-3 gap-6">
                    
                    <!-- Lüks Üyelik Kartı -->
                    <div class="bento-card-dark col-span-1 md:col-span-1 flex flex-col justify-between" style="background: linear-gradient(135deg, #1a1a1a 0%, #050505 100%);">
                        <div>
                            <span class="text-xs uppercase tracking-widest text-santis-gold">Üyelik Statüsü</span>
                            <h2 id="zen-tier-name" class="text-2xl font-playfair font-bold text-white mt-2">...</h2>
                        </div>
                        <div class="mt-8">
                            <span class="text-4xl font-light text-white"><span id="zen-coins">0</span> <span class="text-sm text-gray-500">S-Coin</span></span>
                        </div>
                    </div>

                    <!-- Yaklaşan Rezervasyon -->
                    <div class="bento-card-dark col-span-1 md:col-span-1 relative overflow-hidden">
                        <div class="absolute inset-0 opacity-10 bg-[url('/assets/img/cards/santis_card_hammam_lux.webp')] bg-cover bg-center"></div>
                        <div class="relative z-10">
                            <span class="text-xs uppercase tracking-widest text-gray-400">Sonraki Randevunuz</span>
                            <h3 id="zen-booking-service" class="text-xl font-playfair text-santis-gold mt-2">...</h3>
                            <p id="zen-booking-date" class="text-md text-white mt-4">...</p>
                            <p class="text-sm text-gray-500 mt-1">Terapist: <span id="zen-booking-therapist" class="text-white">...</span></p>
                        </div>
                    </div>

                    <!-- AI Dynamic Morph Kartı (Konsiyerj) -->
                    <div class="bento-card-dark col-span-1 md:col-span-1 p-0 overflow-hidden santis-card cursor-pointer group" id="zen-ai-card">
                        <a href="#" id="zen-ai-url" class="block w-full h-full relative" style="text-decoration: none;">
                            <img id="zen-ai-image" src="" alt="AI Recommendation" class="w-full h-full object-cover absolute inset-0 opacity-60 group-hover:opacity-100 transition-opacity duration-700 vt-hero-image" width="1200" height="800" decoding="async" />
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                            <div class="absolute bottom-0 left-0 p-6 w-full">
                                <span class="text-xs uppercase tracking-widest text-santis-gold shadow-lg">Sizin İçin Seçilen (AI)</span>
                                <h3 id="zen-ai-title" class="text-2xl font-playfair text-white mt-1 vt-hero-title">...</h3>
                                <p id="zen-ai-price" class="text-sm font-bold text-white mt-2">...</p>
                            </div>
                        </a>
                    </div>
                    
                </div>
            </div>
