<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign HQ | God Mode Radar</title>
    <style>
        /* Siber-Lüks (Cyber-Luxury) Temelleri */
        :root {
            --bg-color: #030303;
            --gold: #d4af37;
            --gold-dim: rgba(212, 175, 55, 0.2);
            --neon-green: #00ffcc;
            --alert-red: #ff3366;
            --panel-bg: rgba(15, 15, 15, 0.85);
        }

        body {
            margin: 0;
            padding: 40px;
            background-color: var(--bg-color);
            color: var(--gold);
            font-family: 'Courier New', Courier, monospace;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0;
            text-shadow: 0 0 10px var(--gold-dim);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            height: 100%;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--gold);
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 0 20px var(--gold-dim);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .panel-header {
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid var(--gold-dim);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- GOD MODE GÖSTERGESİ --- */
        .god-mode-status {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            flex-direction: column;
            gap: 20px;
        }

        .pulse-ring {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(0, 255, 204, 0.1);
            border: 2px solid var(--neon-green);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            animation: pulse 2s infinite;
        }

        .pulse-ring span {
            color: var(--neon-green);
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-green);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 30px rgba(0, 255, 204, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }

        .system-logs {
            width: 100%;
            height: 150px;
            background: #000;
            border: 1px solid #333;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.9rem;
            color: #888;
        }

        /* --- FLIGHT RISK RADARI --- */
        .flight-risk-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .risk-item {
            background: rgba(255, 51, 102, 0.1);
            border-left: 4px solid var(--alert-red);
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            animation: slideIn 0.3s ease-out;
        }

        .risk-item .visitor-id {
            color: #fff;
            font-weight: bold;
        }

        .risk-item .reason {
            color: var(--alert-red);
        }

        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .blinking-dot {
            width: 10px;
            height: 10px;
            background-color: var(--alert-red);
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <h1>👑 Sovereign Karargâh</h1>

    <div class="dashboard-grid">
        <div class="panel">
            <div class="panel-header">
                <span>👁️ GOD'S EYE: AKTİF</span>
                <span style="color: var(--neon-green);">OMNI-SYNC ONAYLI</span>
            </div>
            <div class="god-mode-status">
                <div class="pulse-ring">
                    <span>LIVE</span>
                </div>
                <div style="text-align: center;">
                    <div style="font-size: 2rem; color: #fff;" id="active-connections">-</div>
                    <div>Canlı Veri Bekleniyor</div>
                </div>
                <div class="system-logs" id="sys-logs">
                    <div>[SİSTEM] God Mode başlatıldı.</div>
                    <div>[SİSTEM] Kalkanlar devrede. Sıfır Gecikme aktif.</div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>🚨 FLIGHT RISK RADARI</span>
                <div class="blinking-dot"></div>
            </div>
            <ul class="flight-risk-list" id="risk-list">
                <li class="risk-item" style="opacity: 0.5; border-color: #555; background: transparent;">
                    <span>Radar temiz. Tüm ziyaretçiler yörüngede.</span>
                </li>
            </ul>
        </div>
    </div>

    <script>
        const sysLogs = document.getElementById('sys-logs');
        const riskList = document.getElementById('risk-list');
        const activeConnections = document.getElementById('active-connections');

        let connectionCount = 0; 

        function addLog(message, type = 'info') {
            const div = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            
            let color = '#888'; // Varsayılan: Gri (Info)
            if (type === 'success') color = '#00ffcc'; // Neon Yeşil (Giriş)
            if (type === 'error') color = '#ff3366';   // Neon Kırmızı (Hata/Kopma)
            
            div.innerHTML = `<span style="color: ${color}">[${time}] ${message}</span>`;
            sysLogs.appendChild(div);
            sysLogs.scrollTop = sysLogs.scrollHeight;
        }

        // 🟢 YENİ BAĞLANTI (Altın Hale Efekti)
        function handleNewConnection(visitorId) {
            connectionCount++;
            activeConnections.innerText = connectionCount;
            addLog(`✨ Sovereign Ağına Yeni Katılım: ${visitorId}`, 'success');
            
            // Pulse halkasını anlık olarak altın rengine çevir
            const pulseRing = document.querySelector('.pulse-ring');
            pulseRing.style.borderColor = 'var(--gold)';
            pulseRing.style.boxShadow = '0 0 30px rgba(212, 175, 55, 0.6)';
            
            setTimeout(() => {
                // 1 saniye sonra normal neon yeşile dön
                pulseRing.style.borderColor = 'var(--neon-green)';
                pulseRing.style.boxShadow = '0 0 30px rgba(0, 255, 204, 0.4)';
            }, 1000);
        }

        // 🔴 KOPMA / FLIGHT RISK (Kırmızı Kuantum Noktası Efekti)
        function triggerFlightRisk(visitorId, pathname, reason, code = 1006) {
            if(riskList.children[0] && riskList.children[0].innerText.includes("Radar temiz")) {
                riskList.innerHTML = '';
            }

            const li = document.createElement('li');
            li.className = 'risk-item';
            
            // Sanitizer filtrelerine göre renk kodlaması:
            let borderColor = '#ff3366'; // Hatalı kopma (ECONNABORTED vb.)
            let isBlinking = 'blinking-dot'; // Hatalı kopmalarda yanıp sön
            
            if(code === 1000) {
                borderColor = '#888'; // Normal kapanış (Clean close)
                isBlinking = ''; // Normal çıkışta yanıp sönme
            }

            li.style.borderLeftColor = borderColor;

            li.innerHTML = `
                <div>
                    <div class="visitor-id">Kimlik: ${visitorId} <span class="${isBlinking}" style="background-color:${borderColor}; display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:5px;"></span></div>
                    <div style="font-size: 0.85rem; color: #aaa;">Son Rota: ${pathname || 'Bilinmiyor'}</div>
                </div>
                <div class="reason" style="color:${borderColor}">Kod: ${code} | Neden: ${reason}</div>
            `;
            
            riskList.insertBefore(li, riskList.firstChild);
            
            if(riskList.children.length > 5) {
                riskList.removeChild(riskList.lastChild);
            }

            if(code !== 1000) {
                addLog(`⚠️ SOFT FLIGHT RISK: ${visitorId} koptu. (${reason})`, 'error');
            } else {
                addLog(`👋 Ziyaretçi ayrıldı: ${visitorId}`, 'info');
            }
        }

        // --- GERÇEK ZAMANLI SOVEREIGN WEBSOCKET ENTEGRASYONU ---
        function connectSovereignWS() {
            addLog("📡 Otonom İstihbarat Ağına (WebSocket) Bağlanılıyor...");
            
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const port = window.location.port ? `:${window.location.port}` : '';
            const token = window.SANTIS_WS_TOKEN || localStorage.getItem("SANTIS_WS_TOKEN") || "santis-dev-token";
            const wsUrl = `${wsProtocol}//${window.location.hostname}:8080/ws?token=${encodeURIComponent(token)}`;
            
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                addLog("✅ God Mode Radar Ağa Kilitlendi. Omni-Sync Aktif.", 'success');
                
                let identity = null;
                let identitySource = 'Sovereign_Core';
                if (window.SantisIdentity) { identity = window.SantisIdentity.getIdentityBundle(); }
                if (!identity) {
                    identitySource = 'fallback_ephemeral';
                    const generateId = (p) => `${p}-EPHEM-${Math.random().toString(36).slice(2, 10).toUpperCase()}`;
                    let vid = null, sid = null;
                    try {
                        vid = localStorage.getItem('santis.visitorId') || generateId('VIS');
                        localStorage.setItem('santis.visitorId', vid);
                        sid = sessionStorage.getItem('santis.sessionId') || generateId('SES');
                        sessionStorage.setItem('santis.sessionId', sid);
                    } catch(e) {
                        vid = generateId('VIS');
                        sid = generateId('SES');
                    }
                    identity = { visitorId: vid, sessionId: sid, connectionId: generateId('CONN') };
                }

                ws.send(JSON.stringify({ 
                    type: 'INIT', 
                    namespace: 'admin',
                    token: 'ANONYMOUS',
                    visitorId: identity.visitorId,
                    sessionId: identity.sessionId,
                    connectionId: identity.connectionId,
                    timestamp: Date.now(),
                    capabilities: ['telemetry:read', 'system:god_mode'],
                    meta: { identitySource }
                }));
            };

            ws.onmessage = async (event) => {
                let dataText = event.data;
                if (dataText instanceof Blob) {
                    dataText = await dataText.text();
                }

                try {
                    const data = JSON.parse(dataText);
                    
                    if (data.type === 'TELEMETRY_BROADCAST') {
                        if (data.event === 'FLIGHT_RISK_SIGNAL') {
                            triggerFlightRisk(data.visitorId || 'Anonim Gölgeler', data.path || 'Bilinmeyen Rota', data.score || 'Kopma', data.closeCode || 1006);
                        } else if (data.event === 'HOT_LEAD') {
                            addLog(`💰 SICAK SATIŞ: ${data.visitorId} (${data.score}) -> ${data.path}`, 'success');
                        } else if (data.event === 'VISITOR_ENTER') {
                            handleNewConnection(data.visitorId || 'Biyometrik-X');
                        }
                    } 
                    else if (data.type === 'LIVE_PULSE' && data.data) {
                        connectionCount = data.data.activeGuests || 0;
                        activeConnections.innerText = connectionCount;
                    }
                    else if (data.type === 'VISITOR_CONNECTED') {
                        handleNewConnection(data.visitorId || 'Hedef');
                    }
                    
                } catch(e) {}
            };

            ws.onclose = () => {
                addLog("🔴 İstihbarat Ağı Koptu. Yeniden Bağlanılıyor (3s)...", 'error');
                activeConnections.innerText = "KOPUK";
                setTimeout(connectSovereignWS, 3000);
            };

            ws.onerror = (err) => {
                console.error("WS Error", err);
            };
        }

        connectSovereignWS();
    </script>
    <script type="module" src="/admin/js/core/sovereign-command.js"></script>
</body>
</html>
