[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

# ─── 1. VERİ GİRİŞİ (INPUTS) ────────────────────────────────────────────────
[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224
    Tag          santis.frontend.*

[INPUT]
    Name         http
    Listen       0.0.0.0
    Port         8888
    Tag          santis.telemetry.batch

# ─── 2. KARDİNALİTE YÖNETİMİ & FİLTRELER (Sovereign Filters) ────────────────
# Kullanıcı Davranışı (Friction, Rage Clicks, Dwell Time)
# Aşırı yüksek kardinaliteli UID ve Session verilerini hashleyerek anonimize et
# veya 'kova'lara (buckets) grupla.

[FILTER]
    Name         record_modifier
    Match        santis.frontend.behavior
    # Tüm loglara Sovereign System Damgası Vur
    Record       system_layer  KINETIC_UI
    Record       os_version    V32_GODS_EYE

[FILTER]
    Name         lua
    Match        santis.frontend.friction
    # Yüksek kardinaliteyi ezmek için Lua scripti (örn: dwell time <10s ise 'low', >10s ise 'high' bucket oluşturur)
    script       telemetry_shaper.lua
    call         shape_cardinality

[FILTER]
    Name         throttle
    Match        santis.telemetry.batch
    # DoS ve Data patlamasını engellemek için Saniyede Max 500 Log
    Rate         500
    Window       5
    Interval     1s

# ─── 3. ÇIKIŞ (OUTPUT - VERİ GÖLÜNE AKTARIM) ─────────────────────────────────
[OUTPUT]
    # OTLP Collector'a veya doğrudan OpenObserve HTTP Endpoit'ine döküm
    Name         http
    Match        *
    Host         openobserve-core
    Port         5080
    URI          /api/default/santis_telemetry/_json
    Header       Authorization Basic YXJjaGl0ZWN0QHNhbnRpcy5vczpTb3ZlcmVpZ25Hb2RzRXllMjAyNiE=
    Format       json
    Retry_Limit  5
